# PgCloudDoc 前端 + 反向代理（生产）。
#
# 单 origin 部署，浏览器只跟这一处打交道：
#   /           静态资源（SPA，history 路由回退 index.html）
#   /api/       → Nest REST
#   /collab/    → Yjs WebSocket
#   /notifications → 站内消息 WebSocket（用户级）
#   /health*    → 后端探针（只放 liveness/readiness，不暴露 /health/deps）
#
# 为什么坚持同源：refresh token 是 httpOnly cookie，跨域必须 SameSite=None + Secure
# 且每个请求都要过 CORS；同源直接绕开这两个坑。

# WebSocket 升级头。用 map 而不是写死 "upgrade"：
# 普通 HTTP 请求走到这里时 Connection 应该是 close，不能一直保持连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 请求 id：客户端带合法值就透传，否则由 nginx 生成（32 位十六进制，
# 符合后端 ^[\w-]{1,64}$ 的校验）
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ''      $request_id;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # 与后端 BODY_RAW_LIMIT(8mb) 对齐：超限的请求在边缘就拒掉，不进 Node
    client_max_body_size 8m;

    # ── 安全响应头 ──
    # 注意：location 里一旦再写 add_header，这里的全部不再继承（nginx 的已知行为），
    # 所以下面各 location 只用 expires 控制缓存，不重复 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 压缩 ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── 容器健康检查 ──
    # 只证明 nginx 活着；整条链路是否就绪由下面的 /health/ready 判断
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ── 后端探针（给外部监控 / 负载均衡用）──
    location = /health {
        proxy_pass http://backend:3000/health;
        include /etc/nginx/conf.d/proxy-headers.inc;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://backend:3000/health/ready;
        include /etc/nginx/conf.d/proxy-headers.inc;
        access_log off;
    }

    # ── REST ──
    # 插件上传：zip 比普通 JSON 大，单独放宽体积限制（其余接口仍保持 8m）
    location = /api/v1/admin/plugins/upload {
        client_max_body_size 60m;
        proxy_pass http://backend:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
        # 后端已有自己的超时控制（PG statement_timeout 15s），这边留宽一点
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # ── 协同 WebSocket ──
    location /collab/ {
        proxy_pass http://backend:3000;
        # proxy_http_version 1.1 已由 proxy-headers.inc 提供，这里不再重复
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/conf.d/proxy-headers.inc;
        # 文档开着可能几小时不重连，默认的 60s 读超时会把连接掐掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 不缓冲：Yjs 的 update 要尽快双向到达
        proxy_buffering off;
    }

    # ── 站内消息 WebSocket（用户级通知）──
    location /notifications {
        proxy_pass http://backend:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/conf.d/proxy-headers.inc;
        # 通知连接和协同一样要长期保持，别被默认读超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── 静态资源 ──
    # Vite 产物带内容 hash，可以长缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ── 插件静态产物 ──
    # backend 写入共享 volume，nginx 只读挂载；版本目录不可变，可以长缓存。
    # location 里一旦写 add_header，server 级的安全头不再继承，所以这里重复声明。
    location /plugin-assets/ {
        alias /var/lib/pgclouddoc/plugins/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html 不能缓存：否则发版后浏览器拿着旧壳子去请求已经删掉的 hash 资源
    location = /index.html {
        expires -1;
    }

    # ── SPA 路由回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────── 启用 HTTPS ───────────────────────────
# 证书放进 deploy/certs/，compose 里把该目录挂到 /etc/nginx/certs，
# 再把下面的 server 块打开、把 80 的 server 改成 301 跳转。
# 同时 deploy/.env.production 里 COOKIE_SECURE=true、PUBLIC_ORIGIN=https://你的域名。
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name 你的域名;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # 其余 location 与上面 80 的 server 完全一致，抽成 include 即可
# }
