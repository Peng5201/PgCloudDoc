# PgCloudDoc 生产 Kafka（单节点 KRaft，无 ZooKeeper）。
#
# 和开发用的 backend/kafka/server.properties 的区别只有一个：双 listener。
# 开发时 backend 跑在宿主机，advertised 写 localhost:9092 就够；
# 生产 backend 跑在 compose 网络里，容器之间必须用服务名，于是拆成：
#
#   INTERNAL://kafka:9092   给 compose 内的 backend（KAFKA_BROKERS=kafka:9092）
#   EXTERNAL://localhost:9094  给宿主机上的调试工具（compose 只绑到 127.0.0.1）
#
# advertised.listeners 必须写**客户端能解析到的地址**，这是 Kafka 最容易踩的坑：
# broker 返回给客户端的地址如果不可路由，客户端会一直重连。

############################# 节点身份 #############################
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

############################# 监听 #############################
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

############################# 日志目录 #############################
log.dirs=/var/lib/kafka/data
num.recovery.threads.per.data.dir=1

############################# 网络 #############################
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# 副本 #############################
# 单节点：副本因子必须全是 1，否则 topic 建不出来。
# 这是本部署唯一的 HA 短板 —— 有高可用要求请换 3 节点集群或托管 Kafka。
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
min.insync.replicas=1

############################# 消费组 #############################
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true
log.retention.hours=168
log.segment.bytes=1073741824
